quality_findings:
  - id: RASTER_UNTAGGED_ASSUMED_SRGB
    category: INPUT
    severity: info
    repair: provide_embedded_icc_or_png_srgb
    message_key: finding.input.raster_untagged_assumed_srgb
    owner: spike-runner
  - id: INPUT_POSE_OUTSIDE_ENVELOPE
    category: INPUT
    severity: blocking
    repair: replace_input
    message_key: finding.input.pose_outside_envelope
    owner: product-ml
  - id: ONTOLOGY_SLOT_LOW_CONFIDENCE
    category: INSTANCE
    severity: review
    repair: inspect_or_replace
    message_key: finding.instance.slot_low_confidence
    owner: ml
  - id: GENERATED_REGION_IDENTITY_RISK
    category: INPAINT
    severity: blocking
    repair: replace_input
    message_key: finding.inpaint.identity_risk
    owner: ml-graphics
  - id: MESH_INVALID
    category: MESH
    severity: blocking
    repair: regenerate_or_block
    message_key: finding.mesh.invalid
    owner: graphics
  - id: PARAMETER_RANGE_UNSAFE
    category: RIG
    severity: review
    repair: reduce_or_disable
    message_key: finding.rig.range_unsafe
    owner: graphics
  - id: PACKAGE_INTEGRITY_FAILED
    category: PACKAGE
    severity: blocking
    repair: internal_repackage
    message_key: finding.package.integrity_failed
    owner: format-security
  - id: PSD_INTEROP_FAILED
    category: EXPORT
