registry: oneclick2d.reason-codes
version: 0.1.0
status: initiation-candidate
# Distinct axes: eligibility decision, admission outcome, accepted-run terminal state, quality finding.
operational_causes:
  - id: INPUT_FILE_UNSAFE
    applies_to: validation
    outcome_field: eligibility_decision
    outcome: BLOCK
    retryable: false
    user_action: replace_input
    http_problem_code: input_file_unsafe
    message_key: cause.input_file_unsafe
    telemetry_category: INPUT
    severity: blocking
    owner: platform-security
  - id: INPUT_UNSUPPORTED
    applies_to: validation
    outcome_field: eligibility_decision
    outcome: BLOCK
    retryable: false
    user_action: replace_input
    http_problem_code: input_unsupported
    message_key: cause.input_unsupported
    telemetry_category: INPUT
    severity: blocking
    owner: product-ml
  - id: CAPACITY_UNAVAILABLE
    applies_to: generation_admission
    outcome_field: admission_outcome
    outcome: REJECTED
    creates_run: false
    retryable: true
    user_action: retry_after
    http_problem_code: capacity_unavailable
    message_key: cause.capacity_unavailable
    telemetry_category: RESOURCE
    severity: review
    owner: platform
  - id: STAGE_TRANSIENT_FAILURE
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: FAILED
    retryable: true
    user_action: retry
    http_problem_code: stage_transient_failure
    message_key: cause.stage_transient_failure
    telemetry_category: RESOURCE
    severity: review
    owner: platform
  - id: USER_CANCELLED
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: CANCELLED
    retryable: false
    user_action: start_new_run
    http_problem_code: user_cancelled
    message_key: cause.user_cancelled
    telemetry_category: CANCELLED
    severity: info
    owner: product
  - id: EXPORT_VERIFICATION_FAILED
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: FAILED
    retryable: false
    user_action: contact_support
    http_problem_code: export_verification_failed
    message_key: cause.export_verification_failed
    telemetry_category: EXPORT
    severity: blocking
    owner: format-export
  - id: STAGE_RESOURCE_LIMIT_EXCEEDED
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: FAILED
    retryable: false
    user_action: inspect_spike_configuration
    http_problem_code: stage_resource_limit_exceeded
    message_key: cause.stage_resource_limit_exceeded
    telemetry_category: RESOURCE
    severity: blocking
    owner: spike-runner
  - id: STAGE_CONTRACT_VIOLATION
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: FAILED
    retryable: false
    user_action: inspect_spike_contract
    http_problem_code: stage_contract_violation
    message_key: cause.stage_contract_violation
    telemetry_category: PACKAGE
    severity: blocking
    owner: spike-runner
  - id: STAGE_INTERNAL_ERROR
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: FAILED
    retryable: false
    user_action: inspect_local_test_failure
    http_problem_code: stage_internal_error
    message_key: cause.stage_internal_error
    telemetry_category: RESOURCE
    severity: blocking
    owner: spike-runner
  - id: RASTER_DEPENDENCY_UNAVAILABLE
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: BLOCKED
    retryable: false
    user_action: install_locked_spike_dependency
    http_problem_code: raster_dependency_unavailable
    message_key: cause.raster.dependency_unavailable
    telemetry_category: LICENSE
    severity: blocking
    owner: spike-runner
  - id: RASTER_RUNTIME_UNSUPPORTED
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: BLOCKED
    retryable: false
    user_action: use_locked_spike_runtime
    http_problem_code: raster_runtime_unsupported
    message_key: cause.raster.runtime_unsupported
    telemetry_category: RESOURCE
    severity: blocking
    owner: spike-runner
  - id: RASTER_INPUT_BLOCKED
    applies_to: accepted_run
    outcome_field: run_terminal_state
    outcome: BLOCKED
    retryable: false
    user_action: replace_input_or_inspect_reason
    http_problem_code: raster_input_blocked
    message_key: cause.raster.input_blocked
    telemetry_category: INPUT
    severity: blocking
    owner: spike-runner
  # Raster adapter subcodes are local spike diagnostics grouped under RASTER_INPUT_BLOCKED;
  # manifests never include paths, metadata, free text, or raw exception details.
  - id: RASTER_MEDIA_TYPE_MISMATCH
